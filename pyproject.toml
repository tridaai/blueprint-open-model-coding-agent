[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trida-blueprint-open-model-coding-agent"
version = "0.1.0"
description = "Trida AI Blueprint — Open-Model Coding Agent on Baseten (reference prototype)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.13"
# Direct dependencies are pinned EXACTLY (==). The full transitive set is
# frozen in constraints.txt; the pip fallback installs that set first and
# the package itself second (see Makefile, target install-pip).
dependencies = [
    "fastapi==0.143.0",
    "pydantic==2.14.0",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.2.9",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[project.scripts]
coding-agent = "open_model_coding_agent.cli:main"
coding-agent-demo = "open_model_coding_agent.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
open_model_coding_agent = ["static/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
