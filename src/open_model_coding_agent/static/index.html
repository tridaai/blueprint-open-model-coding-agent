<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open-Model Coding Agent — Trida AI Blueprint</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
         background: #ffffff; color: #0A0A0A; margin: 0; }
  header, main, footer { max-width: 1020px; margin: 0 auto; padding: 0 20px; }
  header { display: flex; align-items: center; gap: 14px; padding-top: 24px; }
  header img { width: 44px; height: 44px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 28px 0 10px; }
  .sub { color: #555; font-size: 13px; margin-top: 2px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid #E5E5EF; text-align: left; padding: 7px 8px;
           vertical-align: top; }
  th { color: #555; font-weight: 600; }
  button { background: #4F46E5; color: #fff; border: 0; border-radius: 6px;
           padding: 6px 12px; font-size: 13px; cursor: pointer; margin-right: 6px; }
  button.secondary { background: #ECECF7; color: #0A0A0A; }
  button.danger { background: #B91C1C; }
  button:disabled { opacity: 0.45; cursor: default; }
  .status { font-weight: 600; }
  .ok { color: #15803D; } .bad { color: #B91C1C; } .mid { color: #B45309; }
  pre { background: #F7F7FB; border: 1px solid #E5E5EF; border-radius: 8px;
        padding: 12px; font-size: 12px; overflow-x: auto; white-space: pre-wrap; }
  .card { border: 1px solid #E5E5EF; border-radius: 10px; padding: 14px 16px;
          margin: 12px 0; }
  .muted { color: #555; font-size: 12px; }
  footer { margin-top: 44px; padding-top: 18px; padding-bottom: 28px;
           border-top: 1px solid #E5E5EF; display: flex; gap: 18px;
           align-items: center; font-size: 13px; }
  footer img { width: 28px; height: 28px; }
  footer a { color: #4F46E5; text-decoration: none; }
  #error { color: #B91C1C; font-size: 13px; min-height: 18px; }
</style>
</head>
<body>
<header>
  <img src="https://trida.ai/logos-rounded/trida-rounded.png" alt="Trida AI">
  <div>
    <h1>Open-Model Coding Agent</h1>
    <div class="sub" id="readiness">loading…</div>
  </div>
</header>
<main>
  <div id="error"></div>

  <h2>Gold tasks — the benchmark suite</h2>
  <div id="gold"></div>

  <h2>Work orders</h2>
  <table>
    <thead><tr><th>ID</th><th>Title</th><th>Status</th><th>Scope</th><th></th></tr></thead>
    <tbody id="orders"></tbody>
  </table>

  <h2>Cost per successful task — by model profile</h2>
  <div id="costs"><div class="muted">loading…</div></div>

  <div id="detail"></div>
</main>
<footer>
  <img src="https://trida.ai/logos-rounded/trida-rounded.png" alt="Trida AI">
  <span>Trida AI Blueprint — Open-Model Coding Agent</span>
  <a href="https://trida.ai">Visit Trida AI →</a>
  <a href="https://trida.ai/blog?category=blueprints">View all blueprints →</a>
</footer>

<script>
const $ = (id) => document.getElementById(id);
let actor = "Console Reviewer";

async function api(path, method = "GET", body = null) {
  const res = await fetch(path, {
    method,
    headers: { "Content-Type": "application/json" },
    body: body ? JSON.stringify(body) : null,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || (res.status + " " + res.statusText));
  return data;
}

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

async function loadReadiness() {
  const r = await api("/readiness");
  $("readiness").textContent =
    `store: ${r.store} · model profile: ${r.model_profile}` +
    (r.baseten_model ? ` · Baseten default slug: ${r.baseten_model}` : "");
}

async function loadGold() {
  const tasks = await api("/api/gold-tasks");
  $("gold").innerHTML = tasks.map((t) => `
    <div class="card">
      <strong>${esc(t.title)}</strong>
      <span class="muted">(${esc(t.id)})</span>
      <div>${esc(t.task_text)}</div>
      <div class="muted">scope: ${t.file_scope.map(esc).join(", ")}</div>
      <div style="margin-top:8px">
        <button onclick="createFromGold('${esc(t.id)}')">Create work order</button>
      </div>
    </div>`).join("");
}

async function loadCosts() {
  const report = await api("/api/costs");
  const money = (v) => (v === null || v === undefined) ? "—" : "$" + v;
  const row = (label, e) => `
    <tr>
      <td>${esc(label)}</td>
      <td>${e.runs}</td>
      <td>${e.successful_tasks}</td>
      <td>${money(e.cost_per_successful_task)}</td>
      <td>${money(e.priced_cost)}</td>
      <td>${e.priced_tokens} priced · ${e.unpriced_tokens} unpriced` +
        (e.unpriced_reasons && e.unpriced_reasons.length
          ? ` (${e.unpriced_reasons.map(esc).join(", ")})` : "") +
        (e.scripted_chars ? ` · ${e.scripted_chars} scripted chars (never priced)` : "") +
      `</td>
    </tr>`;
  $("costs").innerHTML = `
    <table>
      <thead><tr><th>Profile</th><th>Runs</th><th>Verified successes</th>
        <th>Cost / successful task</th><th>Priced spend</th><th>Usage</th></tr></thead>
      <tbody>
        ${(report.profiles || []).map((p) => row(p.profile_id, p)).join("")}
        ${row("all profiles", report.total)}
      </tbody>
    </table>
    <div class="muted">Priced under the governed price table (each usage row under the
      table version stamped on it). Unpriced usage is counted, never zeroed;
      the offline model's scripted accounting is characters, never priced as tokens.</div>`;
}

async function createFromGold(id) {
  try {
    const order = await api(`/api/work-orders/from-gold/${id}`, "POST");
    await loadOrders();
    await showDetail(order.work_order_id);
  } catch (e) { showError(e); }
}

async function loadOrders() {
  const orders = await api("/api/work-orders");
  $("orders").innerHTML = orders.map((o) => `
    <tr>
      <td>${esc(o.work_order_id)}</td>
      <td>${esc(o.title)}</td>
      <td class="status">${esc(o.status)}</td>
      <td>${o.file_scope.map(esc).join("<br>")}</td>
      <td><button class="secondary" onclick="showDetail('${esc(o.work_order_id)}')">Open</button></td>
    </tr>`).join("") || `<tr><td colspan="5" class="muted">No work orders yet.</td></tr>`;
}

function showError(e) { $("error").textContent = e.message || String(e); }
function clearError() { $("error").textContent = ""; }

async function act(path, body, id) {
  clearError();
  try {
    await api(path, "POST", body);
    await loadOrders();
    await loadCosts();
    await showDetail(id);
  } catch (e) { showError(e); }
}

async function showDetail(id) {
  clearError();
  const d = await api(`/api/work-orders/${id}`);
  const o = d.work_order, plan = d.plan, runs = d.runs || [];
  const run = runs[runs.length - 1];
  let html = `<h2>Work order ${esc(o.work_order_id)} — ${esc(o.title)}</h2>
    <div class="card">
      <div>${esc(o.task_text)}</div>
      <div class="muted">status: <span class="status">${esc(o.status)}</span>
        · target: ${esc(o.target_path)}</div>`;
  if (!plan && o.status === "draft") {
    html += `<div style="margin-top:10px">
      <button onclick="act('/api/work-orders/${id}/plan', null, '${id}')">Draft plan</button></div>`;
  }
  const plans = (d.plans && d.plans.length) ? d.plans : (plan ? [plan] : []);
  plans.slice().reverse().forEach((p, i) => {
    html += planHtml(p, i === 0);
    if (i === 0 && o.status === "plan_ready") {
      html += `<div style="margin-top:10px">
        <button onclick="decidePlan('${id}', true)">Approve plan</button>
        <button class="danger" onclick="decidePlan('${id}', false)">Reject plan</button></div>`;
    }
  });
  if (o.status === "approved") {
    html += `<div style="margin-top:10px">
      <button onclick="act('/api/work-orders/${id}/runs', null, '${id}')">Run the agent</button></div>`;
  }
  if (run) {
    const v = run.verification || {};
    const c = run.cost || {};
    const b = run.budget || {};
    html += `<h3>Run ${esc(run.run_id)} — ${esc(run.status)}</h3>
      <div class="muted">steps: ${run.steps_used} · changed: ${(run.changed_files || []).map(esc).join(", ") || "none"}</div>
      <div>Verification: <span class="${v.passed ? "ok" : "bad"}">${esc(v.reason || "")}</span></div>`;
    if (c.total !== undefined) {
      html += `<div class="muted">cost: $${esc(c.total)} (plan $${esc(c.plan)} · execution $${esc(c.execution)})` +
        (b.max_tokens ? ` · budget: ${b.max_model_calls} calls / ${b.max_tokens} tokens / ${b.max_wall_seconds}s` : ``) +
        (run.budget_stop ? ` · <span class="bad">stopped by its ${esc(run.budget_stop)} budget</span>` : ``) +
        (c.unpriced_tokens ? ` · ${c.unpriced_tokens} tokens unpriced (${(c.unpriced_reasons || []).map(esc).join(", ")})` : ``) +
        (c.scripted_chars ? ` · ${c.scripted_chars} scripted chars (never priced)` : ``) +
        `</div>`;
    }
    if (run.patch) html += `<pre>${esc(run.patch)}</pre>`;
    if (run.interruption_reason) {
      html += `<div class="bad" style="margin-top:8px">Interrupted — ${esc(run.interruption_reason)}` +
        (run.last_checkpoint ? ` · last checkpoint: ${esc(run.last_checkpoint)}` : ``) + `</div>`;
    }
    if (run.partial_patch) {
      html += `<div style="margin-top:8px">Partial patch from the abandoned run — the diff as far as it got` +
        ` (files: ${(run.partial_files || []).map(esc).join(", ")}). It is not reviewable.</div>` +
        `<pre>${esc(run.partial_patch)}</pre>`;
    }
    if (o.status === "interrupted") {
      html += `<div style="margin-top:10px">
        <button onclick="act('/api/work-orders/${id}/runs/${run.run_id}/resume', {actor}, '${id}')">Resume run</button>
        <button class="secondary" onclick="act('/api/work-orders/${id}/runs/${run.run_id}/restart', {actor}, '${id}')">Restart run</button>
        <button class="danger" onclick="abandonRun('${id}', '${run.run_id}')">Abandon run</button></div>`;
    }
    if (o.status === "succeeded") {
      html += `<div style="margin-top:10px">
        <button onclick="decideReview('${id}', true)">Accept patch</button>
        <button class="danger" onclick="decideReview('${id}', false)">Reject patch</button></div>`;
    }
    if (o.status === "accepted") {
      html += `<div class="ok" style="margin-top:8px">Accepted — the .patch file was exported to the run artifacts.</div>`;
    }
    if (o.status === "rejected") {
      html += `<div class="bad" style="margin-top:8px">Rejected at review — the reason is on the audit trail.</div>`;
    }
  }
  html += `<h3>Audit trail</h3><pre>` +
    (d.audit || []).map((a) => `${a.created_at}  ${a.event}  by ${a.actor}`).join("\n") +
    `</pre></div>`;
  $("detail").innerHTML = html;
}

function planHtml(p, isLatest) {
  let html = `<h3>Plan v${p.version} (${esc(p.status)})${isLatest ? "" : " — superseded"}</h3>
    <div>${esc(p.approach)}</div>`;
  if ((p.steps || []).length) {
    html += `<ol style="margin:8px 0 4px; padding-left:22px">` + p.steps.map((s) => `
      <li><div>${esc(s.intent)}</div>
        <div class="muted">files: ${(s.files || []).map(esc).join(", ") || "none"} ·
          tests: ${(s.tests || []).map(esc).join(", ") || "none"}</div></li>`).join("") + `</ol>`;
  }
  html += `<div class="muted">scope: ${p.files.map(esc).join(", ")} ·
    model: ${esc(p.model_profile)}</div>`;
  if (p.scope_fingerprint) {
    const state = p.fingerprint_state || "recorded";
    const cls = state === "current" ? "ok" : (state === "stale" ? "bad" : "mid");
    html += `<div class="muted">scope fingerprint: <span class="${cls}">${esc(state)}</span>
      · ${esc(String(p.scope_fingerprint).slice(0, 12))}… (recorded at approval;
      execution refuses a drifted repo as stale)</div>`;
  } else {
    html += `<div class="muted">scope fingerprint: unrecorded — it is recorded when this version is approved</div>`;
  }
  if (p.decided_by) {
    html += `<div class="muted">decided by ${esc(p.decided_by)} at ${esc(p.decided_at || "")}` +
      (p.decision_note ? ` — ${esc(p.decision_note)}` : "") + `</div>`;
  }
  const diff = p.diff_from_previous;
  if (diff) {
    const parts = [];
    if (diff.steps_added.length) parts.push(`${diff.steps_added.length} step(s) added`);
    if (diff.steps_removed.length) parts.push(`${diff.steps_removed.length} step(s) removed`);
    if (diff.steps_changed.length) parts.push(`${diff.steps_changed.length} step(s) changed`);
    if (diff.files_added.length) parts.push(`scope widened within the order: ${diff.files_added.map(esc).join(", ")}`);
    if (diff.files_removed.length) parts.push(`scope narrowed: ${diff.files_removed.map(esc).join(", ")}`);
    html += `<div style="margin-top:6px"><strong>Amendment of v${diff.from_version}</strong>` +
      (p.amended_by ? ` by ${esc(p.amended_by)}` : "") +
      (parts.length ? ` — ${parts.join(" · ")}` : " — no step changes") + `</div>`;
    diff.steps_changed.forEach((c) => {
      html += `<div class="muted">step changed: “${esc(c.before.intent)}” → “${esc(c.after.intent)}”</div>`;
    });
    diff.steps_added.forEach((s) => {
      html += `<div class="muted">step added: “${esc(s.intent)}”</div>`;
    });
    diff.steps_removed.forEach((s) => {
      html += `<div class="muted">step removed: “${esc(s.intent)}”</div>`;
    });
  }
  return html;
}

async function abandonRun(id, runId) {
  const reason = prompt("Why is this run being abandoned?");
  if (reason === null) return;
  await act(`/api/work-orders/${id}/runs/${runId}/abandon`, {actor, reason}, id);
}

async function decidePlan(id, approve) {
  await act(`/api/work-orders/${id}/plan/decide`,
    { approve, actor, note: approve ? "approved in console" : "rejected in console" }, id);
}

async function decideReview(id, accept) {
  await act(`/api/work-orders/${id}/review`,
    { accept, actor, reason: accept ? null : "rejected in console" }, id);
}

loadReadiness(); loadGold(); loadOrders(); loadCosts();
</script>
</body>
</html>
