# Local stack: the agent shell plus its production-profile store.
# The app defaults to SQLite on a bare `uv run` / `make serve`; under
# compose it runs the Postgres profile.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: codingagent
      POSTGRES_PASSWORD: codingagent
      POSTGRES_DB: codingagent
    ports:
      - "5432:5432"
    volumes:
      - codingagent-db:/var/lib/postgresql/data

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://codingagent:codingagent@db:5432/codingagent
      # The labelled offline profile serves in this stack as shipped.
      MODEL_PROFILE: offline
      # The deployment profile (round 16; records in
      # profiles/deployment/). Naming one binds its rules at
      # startup: flip this to hosted together with a live
      # MODEL_PROFILE and a BASETEN_API_KEY — while the named
      # profile's rules are violated (offline model, missing key),
      # the app refuses to start, by name.
      DEPLOYMENT_PROFILE: local
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - codingagent-data:/app/data

volumes:
  codingagent-db:
  codingagent-data:
